<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROKONT | Blog Yönetimi</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#102f3b;--o:#f26a32;--bg:#f3f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:DM Sans;color:var(--n)}.bar{background:#fff;padding:17px max(24px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center}.bar b{font:800 19px Manrope}.bar a{color:var(--n);text-decoration:none;font-weight:700}.wrap{max-width:1120px;margin:45px auto;padding:0 20px}.intro h1{font:800 36px Manrope;margin:8px 0}.intro p{color:#61777b}.grid{display:grid;grid-template-columns:1fr 320px;gap:22px;margin-top:28px}.box{background:#fff;border:1px solid #dce7e3;border-radius:12px;padding:28px}.box h2{font:800 20px Manrope;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:700;font-size:13px}input,select,textarea{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #d3dfdb;border-radius:6px;font:14px DM Sans}textarea{min-height:100px;resize:vertical}#content{min-height:240px}.wide{grid-column:1/-1}.upload{padding:17px;border:1px dashed #aabdb7;border-radius:8px;background:#f8fbfa}.btn{background:var(--o);border:0;color:#fff;padding:14px 22px;font-weight:700;border-radius:5px;cursor:pointer;margin-top:22px}.post{border-top:1px solid #e2ebe7;padding:14px 0}.post small{color:#d75c2a;font-weight:700}.post h3{margin:6px 0;font:700 15px Manrope}.post button{border:0;background:none;color:#b94435;padding:0;cursor:pointer;font-weight:700}.login{position:fixed;inset:0;background:linear-gradient(130deg,#102f3bf2,#164f55ed);display:grid;place-items:center;z-index:5}.login.hidden{display:none}.login-card{width:min(410px,calc(100% - 40px));background:#fff;border-radius:14px;padding:36px}.login-card h1{font:800 27px Manrope;margin:8px 0}.login-card p{color:#61777b}.login-card button{width:100%;margin-top:18px}.error{color:#b64035;font-size:13px;font-weight:700}@media(max-width:760px){.grid,.fields{grid-template-columns:1fr}.wrap{margin-top:28px}.intro h1{font-size:28px}}</style>
<link rel="icon" type="image/png" href="prokont-logo.png">
</head><body><div class="login" id="login"><div class="login-card"><small>— PROKONT YÖNETİCİ ERİŞİMİ</small><h1>Blog yönetimi</h1><p>Devam etmek için yönetici şifresini girin.</p><input id="pass" type="password" placeholder="Şifre" autofocus><button class="btn" id="enter">Giriş yap →</button><p class="error" id="error"></p></div></div><header class="bar"><b>PROKONT · İçerik Yönetimi</b><a href="blog.html">← Blogu görüntüle</a></header><main class="wrap"><section class="intro"><small>— YÖNETİCİ PANELİ</small><h1>Yeni blog yazısı oluştur</h1><p>Yazı, kapak görseli ve belge eklerini tek ekrandan yönetin.</p></section><div class="grid"><form class="box" id="form"><h2>Yazı detayları</h2><div class="fields"><label class="wide">Başlık<input id="title" required></label><label>Kategori<select id="category"><option>İnşaat Rehberi</option><option>Maliyet & Bütçe</option><option>Malzeme Seçimi</option><option>Tadilat</option></select></label><label>Yazar<input id="author" placeholder="PROKONT Editör"></label><label class="wide">Etiketler<input id="tags" placeholder="tadilat, bütçe, maliyet"></label><label class="wide">Kısa özet<textarea id="excerpt" required></textarea></label><label class="wide">Kapak görseli<input id="cover" type="file" accept="image/*"></label><label class="wide">Yazı içeriği<textarea id="content" required></textarea></label><label class="wide upload">Belge ekleri<input id="files" type="file" multiple></label></div><button class="btn">Yazıyı yayınla →</button></form><aside class="box"><h2>Yayınlanan yazılar</h2><div id="list"></div></aside></div></main><script>const key='prokont_blog_posts';let ps=JSON.parse(localStorage.getItem(key)||'[]');const readFiles=f=>Promise.all([...f].map(x=>new Promise(ok=>{let r=new FileReader;r.onload=()=>ok({name:x.name,url:r.result});r.readAsDataURL(x)})));function draw(){list.innerHTML=ps.map(p=>`<article class="post"><small>${p.category}</small><h3>${p.title}</h3><button data-id="${p.id}">Sil</button></article>`).join('')||'<p>Henüz yazı yok.</p>'}enter.onclick=()=>{if(pass.value==='Prokont!2026'){sessionStorage.admin='1';login.classList.add('hidden')}else error.textContent='Şifre hatalı.'};if(sessionStorage.admin)login.classList.add('hidden');form.onsubmit=async e=>{e.preventDefault();let img=cover.files[0]?(await readFiles(cover.files))[0].url:'',attachments=await readFiles(files.files);ps.unshift({id:Date.now()+'',title:title.value,category:category.value,author:author.value||'PROKONT Editör',tags:tags.value,excerpt:excerpt.value,content:content.value,image:img,attachments,date:new Date().toLocaleDateString('tr-TR')});localStorage.setItem(key,JSON.stringify(ps));form.reset();draw();alert('Yazı yayınlandı.')};list.onclick=e=>{if(e.target.dataset.id){ps=ps.filter(x=>x.id!==e.target.dataset.id);localStorage.setItem(key,JSON.stringify(ps));draw()}};draw()</script></body></html>

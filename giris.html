<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROKONT | Yönetici Girişi</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="blog.css">
<link rel="icon" type="image/png" href="prokont-logo.png">
</head><body><main class="admin-page"><div class="login-card"><a class="brand" href="index.html"><img src="prokont-logo.png" alt="PROKONT"><span>PROKONT<small>MÜHENDİSLİK & İNŞAAT</small></span></a><p class="eyebrow">— YETKİLİ ERİŞİM</p><h1>Blog yönetimi</h1><p>Bu alan yalnızca yöneticiler içindir.</p><form id="f"><label>Kullanıcı adı<input id="u" required></label><label>Şifre<input id="p" type="password" required></label><button class="btn navy">Giriş yap →</button><p id="e" hidden></p></form></div></main><script>f.onsubmit=async x=>{x.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location='blog-yonetim.html';else{e.hidden=false;e.textContent='Kullanıcı adı veya şifre hatalı.'}}</script></body></html>
